<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live Binance Option Chain</title>
<style>
  :root {
    --bg: #131722;
    --card: #1b2030;
    --border: #2a2e3e;
    --text: #d1d4dc;
    --muted: #7a7f8f;
    --green: #26a69a;
    --red: #ef5350;
    --accent: #f0b90b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
  }
  h2, h3 { margin: 0 0 10px; font-weight: 600; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    flex: 1;
    min-width: 220px;
  }
  .label { color: var(--muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: .03em; }
  .value { font-size: 1.6rem; font-weight: 700; margin-top: 4px; }
  .value.up { color: var(--green); }
  .value.down { color: var(--red); }
  .sub { color: var(--muted); font-size: 0.8rem; margin-top: 4px; }

  select {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 0.85rem;
  }

  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  th, td { padding: 6px 8px; text-align: center; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--card); }
  tr.atm { background: rgba(240, 185, 11, 0.08); }
  td.call { color: var(--green); }
  td.put { color: var(--red); }
  .table-wrap { max-height: 480px; overflow-y: auto; border: 1px solid var(--border); border-radius: 10px; }
  .status { color: var(--muted); font-size: 0.75rem; margin-top: 8px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
  .dot.live { background: var(--green); }
  .dot.dead { background: var(--red); }
</style>
</head>
<body>

  <div class="row">
    <div class="card">
      <div class="label">BTCUSDT Spot</div>
      <div class="value" id="spot-price">--</div>
      <div class="sub" id="spot-ts">waiting for data...</div>
    </div>
    <div class="card">
      <div class="label">Nearest Strike / Expiry</div>
      <div class="value" id="nearest-strike" style="font-size:1.3rem;">--</div>
      <div class="sub" id="nearest-expiry">--</div>
    </div>
    <div class="card">
      <div class="label">Nearest Call (Mark / IV)</div>
      <div class="value call" id="call-mark" style="color:var(--green);font-size:1.3rem;">--</div>
      <div class="sub" id="call-iv">--</div>
    </div>
    <div class="card">
      <div class="label">Nearest Put (Mark / IV)</div>
      <div class="value put" id="put-mark" style="color:var(--red);font-size:1.3rem;">--</div>
      <div class="sub" id="put-iv">--</div>
    </div>
  </div>

  <div class="row" style="align-items:center;">
    <h3 style="margin:0;">Full Option Chain</h3>
    <select id="expiry-select"></select>
  </div>

  <div class="table-wrap">
    <table id="chain-table">
      <thead>
        <tr>
          <th colspan="6" style="color:var(--green)">CALL</th>
          <th>Strike</th>
          <th colspan="6" style="color:var(--red)">PUT</th>
        </tr>
        <tr>
          <th>IV</th><th>Delta</th><th>Bid</th><th>Ask</th><th>Mark</th><th>Last</th>
          <th></th>
          <th>Last</th><th>Mark</th><th>Ask</th><th>Bid</th><th>Delta</th><th>IV</th>
        </tr>
      </thead>
      <tbody id="chain-body">
        <tr><td colspan="13" style="color:var(--muted);padding:20px;">Loading chain...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="status">
    <span class="dot" id="conn-dot"></span><span id="conn-text">Connecting to local data server...</span>
  </div>

<script>
  const API_PORT = __API_PORT__;
  const API_BASE = `http://127.0.0.1:${API_PORT}`;

  let lastSpot = null;
  let selectedExpiry = null;
  let expiryListLoaded = false;

  function fmt(n, digits = 2) {
    if (n === null || n === undefined || n === "") return "--";
    const num = parseFloat(n);
    if (isNaN(num)) return "--";
    return num.toLocaleString(undefined, { maximumFractionDigits: digits });
  }

  function setConn(ok, msg) {
    document.getElementById("conn-dot").className = "dot " + (ok ? "live" : "dead");
    document.getElementById("conn-text").textContent = msg;
  }

  async function pollSpot() {
    try {
      const r = await fetch(`${API_BASE}/api/spot`, { cache: "no-store", signal: AbortSignal.timeout(3000) });
      const d = await r.json();
      const el = document.getElementById("spot-price");
      if (d.price !== null && d.price !== undefined) {
        if (lastSpot !== null) {
          el.className = "value " + (d.price >= lastSpot ? "up" : "down");
        }
        el.textContent = "$" + fmt(d.price);
        lastSpot = d.price;
        document.getElementById("spot-ts").textContent = "updated " + new Date(d.ts).toLocaleTimeString();
      }
      setConn(true, "Live — connected to local backend");
    } catch (e) {
      setConn(false, "Backend se connect nahi ho pa raha (main.py chal raha hai?)");
    }
  }

  async function pollNearest() {
    try {
      const r = await fetch(`${API_BASE}/api/nearest`, { cache: "no-store", signal: AbortSignal.timeout(3000) });
      const d = await r.json();
      if (d.error) return;
      document.getElementById("nearest-strike").textContent = fmt(d.strike, 0);
      document.getElementById("nearest-expiry").textContent = "Expiry: " + d.expiry;
      document.getElementById("call-mark").textContent = fmt(d.call && d.call.mark);
      document.getElementById("call-iv").textContent = "IV: " + fmt(d.call && d.call.iv);
      document.getElementById("put-mark").textContent = fmt(d.put && d.put.mark);
      document.getElementById("put-iv").textContent = "IV: " + fmt(d.put && d.put.iv);
    } catch (e) { /* silent — spot poll already reports connection status */ }
  }

  async function loadExpiries() {
    try {
      const r = await fetch(`${API_BASE}/api/expiries`, { cache: "no-store", signal: AbortSignal.timeout(3000) });
      const d = await r.json();
      const sel = document.getElementById("expiry-select");
      if (d.expiries && d.expiries.length) {
        const current = sel.value;
        sel.innerHTML = "";
        d.expiries.forEach(exp => {
          const opt = document.createElement("option");
          opt.value = exp; opt.textContent = exp;
          sel.appendChild(opt);
        });
        if (!expiryListLoaded) {
          selectedExpiry = d.expiries[0];
          sel.value = selectedExpiry;
          expiryListLoaded = true;
        } else if (current) {
          sel.value = current;
        }
      }
    } catch (e) { /* ignore */ }
  }

  document.getElementById("expiry-select").addEventListener("change", (e) => {
    selectedExpiry = e.target.value;
    pollChain();
  });

  async function pollChain() {
    if (!selectedExpiry) return;
    try {
      const r = await fetch(`${API_BASE}/api/optionchain?expiry=${encodeURIComponent(selectedExpiry)}`,
                             { cache: "no-store", signal: AbortSignal.timeout(4000) });
      const d = await r.json();
      const tbody = document.getElementById("chain-body");
      if (!d.rows || !d.rows.length) {
        tbody.innerHTML = `<tr><td colspan="13" style="color:var(--muted);padding:20px;">No data for this expiry yet</td></tr>`;
        return;
      }
      const spot = d.spot;
      let atmStrike = null;
      if (spot) {
        atmStrike = d.rows.reduce((best, r2) =>
          Math.abs(r2.strike - spot) < Math.abs(best - spot) ? r2.strike : best, d.rows[0].strike);
      }
      tbody.innerHTML = d.rows.map(row => `
        <tr class="${row.strike === atmStrike ? 'atm' : ''}">
          <td class="call">${fmt(row.call_iv)}</td>
          <td class="call">${fmt(row.call_delta, 3)}</td>
          <td class="call">${fmt(row.call_bid)}</td>
          <td class="call">${fmt(row.call_ask)}</td>
          <td class="call">${fmt(row.call_mark)}</td>
          <td class="call">${fmt(row.call_last)}</td>
          <td style="font-weight:700;color:var(--accent)">${fmt(row.strike, 0)}</td>
          <td class="put">${fmt(row.put_last)}</td>
          <td class="put">${fmt(row.put_mark)}</td>
          <td class="put">${fmt(row.put_ask)}</td>
          <td class="put">${fmt(row.put_bid)}</td>
          <td class="put">${fmt(row.put_delta, 3)}</td>
          <td class="put">${fmt(row.put_iv)}</td>
        </tr>
      `).join("");
    } catch (e) { /* ignore, next poll will retry */ }
  }

  // Polling intervals — spot is fastest, chain is heavier so slower.
  setInterval(pollSpot, 1500);
  setInterval(pollNearest, 2000);
  setInterval(loadExpiries, 15000);
  setInterval(pollChain, 3000);

  pollSpot(); pollNearest(); loadExpiries().then(pollChain);
</script>
</body>
</html>
